name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Windows fait tourner l'ensemble : c'est la seule plateforme où
  # l'application, l'installateur et les ressources Windows se construisent.
  windows:
    name: Tout (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        # Windows a les polices : les tests de composition doivent y trouver
        # de quoi travailler, et non passer en s'abstenant.
        env:
          ACRUX_REQUIRE_FONTS: "1"
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release --workspace

  # Ailleurs, on vérifie ce que le projet prétend aujourd'hui : le moteur PDF
  # se construit et ses briques de bas niveau passent leurs tests.
  #
  # Deux limites assumées, et dites :
  #
  #  - l'application n'a qu'un backend de fenêtrage (Win32) ; la construire
  #    sur Linux ou macOS n'aurait rien à prouver ;
  #  - le rendu et l'extraction de texte des **polices standard** (§9.6.2.2)
  #    passent aujourd'hui par une police système de substitution. Sur une
  #    machine qui n'en a aucune d'utilisable — le cas des exécuteurs macOS —
  #    les largeurs tombent à zéro et les tests qui mesurent du texte
  #    échouent. C'est un vrai défaut du moteur, noté dans ROADMAP.md ; le
  #    masquer ici serait malhonnête, l'affirmer corrigé le serait plus encore.
  portable:
    name: Moteur (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p acrux-core -p acrux-document -p acrux-codecs -p acrux-fonts
          -p acrux-graphics -p acrux-render -p acrux-features -p acrux-cli
      - name: Build
        run: >
          cargo build
          -p acrux-core -p acrux-document -p acrux-codecs -p acrux-fonts
          -p acrux-graphics -p acrux-render -p acrux-features -p acrux-cli
      - name: Tests (briques indépendantes des polices du système)
        run: >
          cargo test
          -p acrux-core -p acrux-document -p acrux-codecs -p acrux-fonts
          -p acrux-graphics
